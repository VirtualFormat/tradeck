[tool.poetry]
name = "openbb-akshare"
version = "0.1.0"
description = "AKShare extension for OpenBB Platform — A股深度数据"
authors = ["tradeck"]
license = "MIT"
readme = "README.md"
packages = [{ include = "openbb_akshare_provider" }]

[tool.poetry.dependencies]
python = ">=3.10,<4"
akshare = ">=1.12.0"
openbb-core = ">=1.6.10"
pandas = ">=2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_provider_extension"]
akshare = "openbb_akshare_provider:akshare_provider"
