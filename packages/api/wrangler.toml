name = "tradeck-api"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# 静态资源：前端 Vite 构建产物。Worker 先处理 /api/*，其余路径走静态文件（SPA 模式）。
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# 部署时如需 KV / Cron，在此追加 [[kv_namespaces]] / [triggers]。
