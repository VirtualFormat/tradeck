name: Build App Images

# 构建并发布 tradeck 应用镜像到 GHCR（org: virtualformat）：
#   web / api（tradeck 应用层总 API，当前为用户域 auth 入口）/ quant
# 数据管道 collector 与 openbb 镜像在 tradb 仓库的 CI 构建。
# 正式服只 docker compose pull && up，不在服务器拉源码构建。
#
# 多架构（linux/amd64 + linux/arm64）均由 GitHub 原生 runner 构建（零 QEMU）：
#   amd64 -> ubuntu-24.04，arm64 -> ubuntu-24.04-arm（public repo 免费）。
# 每架构 push-by-digest，再由 merge job 用 imagetools 合成 manifest list。
#
# tag 策略：v* tag -> 语义版本 + latest；push develop -> latest（主部署分支）。

on:
  push:
    tags: ["v*"]
    branches: ["develop"]
    paths:
      - "apps/web/**"
      - "apps/backend/**"
      - "apps/quant/**"
      - "apps/mcp/**"
      - ".github/workflows/app-images.yml"
      - "deploy/prewarm-images.py"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: virtualformat

jobs:
  build:
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: tradeck-web, dockerfile: apps/web/Dockerfile, context: apps/web, target: prod }
          - { name: tradeck-api, dockerfile: apps/backend/Dockerfile, context: apps/backend, target: "" }
          - { name: tradeck-quant, dockerfile: apps/quant/Dockerfile, context: apps/quant, target: "" }
          - { name: tradeck-mcp, dockerfile: apps/mcp/Dockerfile, context: apps/mcp, target: "" }
        arch:
          - { platform: linux/amd64, runner: ubuntu-24.04, suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.arch.platform }}
          # 同 openbb-images.yml：push-by-digest 需关 attestation
          provenance: false
          sbom: false
          # 跨 run 复用 Docker 层缓存（lockfile 不变时 pnpm install / pip install
          # / next build 直接命中，全量构建从 ~20min 降到 ~2min）。
          # scope 按 镜像+架构 隔离，避免不同镜像/架构的缓存互相污染。
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch.suffix }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image.name }}
        run: |
          mkdir -p "/tmp/digests/${IMAGE}"
          touch "/tmp/digests/${IMAGE}/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch.suffix }}-${{ matrix.image.name }}
          path: /tmp/digests/${{ matrix.image.name }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [tradeck-web, tradeck-api, tradeck-quant, tradeck-mcp]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*-${{ matrix.image }}
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop' }}

      - name: Create manifest list and push
        id: publish
        working-directory: /tmp/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          CI_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools create \
            --metadata-file /tmp/manifest-metadata.json \
            -t "${IMAGE_REF}:${CI_TAG}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_REF}@sha256:%s " *)
          digest="$(jq -er '."containerimage.descriptor".digest' /tmp/manifest-metadata.json)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "${digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE_REF}@${DIGEST}"

      - name: Prewarm amd64 manifest and all blobs
        continue-on-error: true
        timeout-minutes: 4
        env:
          IMAGE: ${{ env.OWNER }}/${{ matrix.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if ! timeout -k 5s 200s python3 deploy/prewarm-images.py "${IMAGE}@${DIGEST}" --timeout 180; then
            echo "::warning::amd64 blob 预热失败或超时，prod 首次拉取可能回源"
            exit 1
          fi
