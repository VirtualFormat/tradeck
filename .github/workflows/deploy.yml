# 自动部署到 Cloudflare Workers（前端静态 + Hono API 统一 Worker）。
# 需要在 GitHub 仓库 Settings → Secrets 添加：
#   CLOUDFLARE_API_TOKEN  — Cloudflare API 令牌（Workers 部署权限）
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare 账户 ID（仪表盘右侧可见）
#
# 部署后自动验证线上 API（特别是 Yahoo 数据源，本地无法验证因 IP 被封）。
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 构建前端 → packages/web/dist（Worker 部署时作为静态资源一起上传）
      - run: pnpm -F @tradeck/web build

      # 部署 Worker（含静态资源）。用 run deploy 避免被 pnpm 内置 deploy 命令拦截。
      - run: pnpm -F @tradeck/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # 部署后自动验证线上 API（Yahoo 数据源在本地被封，必须线上验证）。
  # 部署成功后等 10 秒让边缘节点生效，然后检查关键接口。
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 # 等待部署生效

      - name: 验证 /api/health
        run: |
          echo "=== /api/health ==="
          curl -s --max-time 15 https://tradeck-api.zqg.workers.dev/api/health | tee /tmp/health.json
          echo
          OK=$(jq -r '.ok' /tmp/health.json)
          if [ "$OK" != "true" ]; then echo "❌ health check failed"; exit 1; fi
          echo "✅ health ok"

      - name: 验证 /api/tickers（必须有 yahoo 数据）
        run: |
          echo "=== /api/tickers ==="
          curl -s --max-time 25 https://tradeck-api.zqg.workers.dev/api/tickers | tee /tmp/tickers.json
          echo
          TOTAL=$(jq 'length' /tmp/tickers.json)
          YH=$(jq '[.[] | select(.source=="yahoo")] | length' /tmp/tickers.json)
          EM=$(jq '[.[] | select(.source=="eastmoney")] | length' /tmp/tickers.json)
          MOCK=$(jq '[.[] | select(.source=="mock")] | length' /tmp/tickers.json)
          echo "total=$TOTAL yahoo=$YH eastmoney=$EM mock=$MOCK"
          if [ "$YH" -eq 0 ]; then echo "❌ NO yahoo tickers — Yahoo fetchQuotes broken"; exit 1; fi
          if [ "$MOCK" -gt 0 ]; then echo "❌ mock tickers leaked into production"; exit 1; fi
          if [ "$TOTAL" -lt 10 ]; then echo "❌ too few tickers ($TOTAL)"; exit 1; fi
          echo "✅ tickers ok ($TOTAL total, $YH yahoo, $EM eastmoney, 0 mock)"

      - name: 验证 /api/ohlcv（Yahoo chart 必须返回真实 K 线）
        run: |
          echo "=== /api/ohlcv?symbol=AAPL ==="
          curl -s --max-time 20 "https://tradeck-api.zqg.workers.dev/api/ohlcv?symbol=AAPL&interval=1d&limit=5" | tee /tmp/ohlcv.json
          echo
          COUNT=$(jq 'length' /tmp/ohlcv.json)
          SRC=$(jq -r '.[0].source // empty' /tmp/ohlcv.json)
          if [ "$COUNT" -eq 0 ]; then echo "❌ no ohlcv bars returned"; exit 1; fi
          if [ "$SRC" != "yahoo" ]; then echo "❌ ohlcv source is $SRC, expected yahoo"; exit 1; fi
          echo "✅ ohlcv ok ($COUNT bars, source=yahoo)"

      - name: 验证 /api/datasources（生产环境不能有 mock）
        run: |
          echo "=== /api/datasources ==="
          curl -s --max-time 15 https://tradeck-api.zqg.workers.dev/api/datasources | tee /tmp/ds.json
          echo
          MOCK=$(jq '[.[] | select(.type=="mock")] | length' /tmp/ds.json)
          YH=$(jq '[.[] | select(.id=="yahoo")] | length' /tmp/ds.json)
          if [ "$MOCK" -gt 0 ]; then echo "❌ mock datasource leaked into production"; exit 1; fi
          if [ "$YH" -eq 0 ]; then echo "❌ yahoo datasource missing"; exit 1; fi
          echo "✅ datasources ok (0 mock, yahoo present)"

      - name: 验证 /api/feed（RSS 必须返回资讯）
        run: |
          echo "=== /api/feed ==="
          curl -s --max-time 20 "https://tradeck-api.zqg.workers.dev/api/feed?limit=5" | tee /tmp/feed.json
          echo
          COUNT=$(jq 'length' /tmp/feed.json)
          if [ "$COUNT" -eq 0 ]; then echo "❌ no feed items"; exit 1; fi
          echo "✅ feed ok ($COUNT items)"

      - name: 验证前端首页可访问
        run: |
          echo "=== GET / (前端) ==="
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://tradeck-api.zqg.workers.dev/)
          if [ "$STATUS" != "200" ]; then echo "❌ homepage returned $STATUS"; exit 1; fi
          echo "✅ homepage ok (200)"
