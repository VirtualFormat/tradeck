# tradeck — CF 橙云回源反代
# 域名：tradeck.virtualformat.cn（按需改 server_name；证书覆盖 *.virtualformat.cn）
# 链路：浏览器 → CF（443，用户侧证书）→ 本 nginx（443，CF Origin 证书）→ 127.0.0.1:3000

# HTTP → HTTPS 跳转（CF Flexible/Full 都会回源 80，统一跳 443）
server {
    listen 80;
    server_name tradeck.virtualformat.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tradeck.virtualformat.cn;

    # CF Origin 证书（仅 CF 回源信任，浏览器不直连）
    ssl_certificate     /etc/nginx/certs/virtualformat.pem;
    ssl_certificate_key /etc/nginx/certs/virtualformat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 只放行 Cloudflare 回源 IP 段（https://www.cloudflare.com/ips/），其余 403
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    # 透传真实访客 IP（CF-Connecting-IP）
    real_ip_header CF-Connecting-IP;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Next.js HMR/SSE 用不到（prod），但保留长连接支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
