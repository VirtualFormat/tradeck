# tradeck 项目 1 — 市场资讯看板
# 架构：PostgreSQL + FastAPI backend + OpenBB 数据源 + Next.js 前端
#
# 使用：
#   cp .env.example .env  # 填 API key（可选，免费源不需要）
#   docker compose up -d --build
#   前端：http://localhost:3000
#   backend API：http://localhost:8080/docs
#   OpenBB API：http://localhost:6900/docs

services:
  # ── 数据存储 ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tradeck-postgres
    environment:
      POSTGRES_DB: tradeck
      POSTGRES_USER: tradeck
      POSTGRES_PASSWORD: tradeck_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 数据源代理 ────────────────────────────────────
  openbb:
    build:
      context: .
      dockerfile: ./docker/openbb/Dockerfile
    container_name: tradeck-openbb
    ports:
      - "6900:6900"
    volumes:
      - openbb-config:/root/.openbb_platform
      - ./packages/openbb-akshare-provider:/opt/openbb-akshare-provider
    environment:
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
      - TIINGO_API_KEY=${TIINGO_API_KEY:-}
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY:-}
      - OPENBB_USER_SETTINGS_DIR=/root/.openbb_platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6900/openapi.json", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 数据管道 + API 服务 ──────────────────────────
  backend:
    build: ./apps/backend
    container_name: tradeck-backend
    environment:
      DATABASE_URL: postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      OPENBB_API_URL: http://openbb:6900
      # 海外节点（韩国瘦 OpenBB）：为空则海外源回落国内 openbb
      OPENBB_OVERSEAS_API_URL: ${OPENBB_OVERSEAS_API_URL:-}
      OPENBB_OVERSEAS_TOKEN: ${OPENBB_OVERSEAS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      openbb:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ── 前端 ──────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: tradeck-web
    ports:
      - "3000:3000"
    environment:
      # 改为从 backend 读（backend 从 DB 读，<50ms）
      - BACKEND_API_URL=http://backend:8080
      # OpenBB API 保留给阶段 1 暂未迁移的组件（movers/macro/commodities/treasury）
      - OPENBB_API_URL=http://openbb:6900
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_started
      openbb:
        condition: service_healthy
    restart: unless-stopped
    command: ["pnpm", "start", "-H", "0.0.0.0"]

volumes:
  openbb-config:
  web-node-modules:
  postgres-data:
