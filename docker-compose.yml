# tradeck 项目 1 — 市场资讯看板
# 架构：PostgreSQL + collector（数据管道/写者）+ data-api（读 API）+ OpenBB 数据源 + Next.js 前端
#
# 注意：mock 种子（apps/mock）仅 dev 可用，prod 不接 mock——本 compose 恒为 live。
#
# 使用：
#   cp .env.example .env  # 填 API key（可选，免费源不需要）
#   docker compose up -d --build
#   前端：http://localhost:3000
#   data-api：http://localhost:8080/docs
#   OpenBB API：http://localhost:6900/docs

services:
  # ── 数据存储 ──────────────────────────────────────
  # 铁律：DB 永不对外暴露宿主机端口，仅内网对 collector / data-api 可见
  postgres:
    image: postgres:16-alpine
    container_name: tradeck-postgres
    environment:
      POSTGRES_DB: tradeck
      POSTGRES_USER: tradeck
      POSTGRES_PASSWORD: tradeck_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # schema 所有权归 collector
      - ./apps/data-collector/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 数据源代理 ────────────────────────────────────
  openbb:
    # GHCR 镜像（需 ghcr 登录/公开发布）：image: ghcr.io/virtualformat/tradeck-openbb:latest
    # 断网/无 registry 兜底：本地构建（当前默认，VPS 有 GHCR 凭据可改回 image）
    build:
      context: .
      dockerfile: ./docker/openbb/Dockerfile
    container_name: tradeck-openbb
    ports:
      - "6900:6900"
    volumes:
      - openbb-config:/root/.openbb_platform
    environment:
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
      - TIINGO_API_KEY=${TIINGO_API_KEY:-}
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY:-}
      - OPENBB_USER_SETTINGS_DIR=/root/.openbb_platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6900/openapi.json", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 数据管道（写者：定时拉取数据源写库 + 内部运维 API）──
  # 不对外映射端口，仅内网可达
  collector:
    build: ./apps/data-collector
    container_name: tradeck-collector
    environment:
      DATA_MODE: ${DATA_MODE:-live}
      DATABASE_URL: postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      OPENBB_API_URL: http://openbb:6900
      # 海外节点（韩国瘦 OpenBB）：为空则海外源回落国内 openbb
      OPENBB_OVERSEAS_API_URL: ${OPENBB_OVERSEAS_API_URL:-}
      OPENBB_OVERSEAS_TOKEN: ${OPENBB_OVERSEAS_TOKEN:-}
      # 数据中心手动同步令牌；留空时后端禁用手动触发
      DATA_SYNC_TOKEN: ${DATA_SYNC_TOKEN:-}
      # TickFlow 日K 源：为空则用免费档 TickFlow.free()
      TICKFLOW_API_KEY: ${TICKFLOW_API_KEY:-}
      # findb 主数据源密钥（A股全市场 + 复权 + 分钟K；一人一设备一把，勿共享）
      FINDB_KEY: ${FINDB_KEY:-}
      # 同花顺金融数据服务（A 股官方源；留空则该源不可用，优雅降级）
      HITHINK_FINANCE_API_KEY: ${HITHINK_FINANCE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      openbb:
        condition: service_healthy
    restart: unless-stopped

  # ── 读 API 服务（从 DB 读，<50ms；_ensure 按需回源经 openbb）──
  data-api:
    build: ./apps/backend
    container_name: tradeck-data-api
    environment:
      DATA_MODE: ${DATA_MODE:-live}
      DATABASE_URL: postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      OPENBB_API_URL: http://openbb:6900
      # 数据中心手动同步令牌；留空时后端禁用手动触发
      DATA_SYNC_TOKEN: ${DATA_SYNC_TOKEN:-}
      # 消费方鉴权令牌表（JSON：{"<token>": "<consumer_name>"}）。留空 = 内网放行；
      # 配置后量化批量接口（/api/bars）强制有效 X-Service-Token。
      SERVICE_TOKENS: ${SERVICE_TOKENS:-}
    depends_on:
      postgres:
        condition: service_healthy
      openbb:
        condition: service_healthy
      collector:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ── 量化引擎（回测/选股/因子挖掘，仅经 data-api 读数，绝不直连 DB）──
  # 默认不启动，按需显式启用 quant profile：
  #   --profile quant run --rm quant ...（一次性任务）或 --profile quant up -d quant（HTTP 服务）
  quant:
    build: ./apps/quant
    container_name: tradeck-quant
    profiles: ["quant"]
    environment:
      # 量化引擎只过 data-api（/api/bars 等批量接口），绝不直连 DB
      BACKEND_API_URL: http://data-api:8080
      # 消费方令牌：与 data-api 的 SERVICE_TOKENS 匹配；留空内网放行
      SERVICE_TOKEN: ${QUANT_SERVICE_TOKEN:-}
      TICKFLOW_API_KEY: ${TICKFLOW_API_KEY:-}
      # Parquet 缓存目录（行情/因子缓存 + enriched 矩阵 + 报告/候选库）
      QUANT_CACHE_DIR: /data/cache
      # AI 策略生成（可选）：全部留空即关闭
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - quant-cache:/data/cache
    ports:
      - "8083:8083"  # HTTP 服务（web 经 Next 代理消费）
    depends_on:
      data-api:
        condition: service_started
    restart: unless-stopped

  # ── 前端 ──────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: prod
    container_name: tradeck-web
    ports:
      # 仅绑 localhost：对外由宿主机 nginx（host 网络 80/443，CF 橙云回源）
      # 反代到 127.0.0.1:3000，web 不直接暴露公网。
      - "127.0.0.1:3000:3000"
    environment:
      # 从 data-api 读（data-api 从 DB 读，<50ms）
      - BACKEND_API_URL=http://data-api:8080
      # OpenBB API 保留给阶段 1 暂未迁移的组件（movers/macro/commodities/treasury）
      - OPENBB_API_URL=http://openbb:6900
      - NODE_ENV=production
    depends_on:
      data-api:
        condition: service_started
      openbb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  openbb-config:
  web-node-modules:
  postgres-data:
  quant-cache:
