# devcontainer 的 docker-compose — 开发环境
# 与项目根的 docker-compose.yml（prod）独立
# 架构：dev（开发容器）+ postgres + collector + data-api + openbb
#
# DATA_MODE=mock 用法（拆分后 seed 无归属进程，由独立 Job 容器完成）：
#   1) 先灌种子：docker compose -f .devcontainer/docker-compose.yml --profile mock run --rm mock-seed
#   2) 再以 DATA_MODE=mock 起 dev/postgres/data-api（见 AGENTS.md「数据运行模式」一节）
name: tradeck_devcontainer

services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.12
    container_name: tradeck-dev
    ports:
      - "3000:3000"
      - "8080:8080"  # backend dev server
    volumes:
      - ..:/workspace:cached
      - dev-node-modules:/workspace/apps/web/node_modules
      - dev-venv:/workspace/.venv
      - dev-openbb-config:/root/.openbb_platform
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      - DATA_MODE=${DATA_MODE:-live}
      - OPENBB_API_URL=http://openbb:6900
      - BACKEND_API_URL=http://data-api:8080
      # collector 内部运维 API（手动同步触发等，备用）
      - COLLECTOR_API_URL=http://collector:8080
      # 量化引擎 HTTP 服务（/api/quant/* 代理的目标；web 容器经 dev-net 主机名访问）
      - QUANT_API_URL=http://quant:8083
      - DATABASE_URL=postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      # Vibe-Trading AI 研究引擎（独立 devcontainer，宿主机 8899；web 容器经 host.docker.internal 访问）
      - VIBE_TRADING_API_URL=${VIBE_TRADING_API_URL:-http://host.docker.internal:8899}
      - VIBE_TRADING_API_KEY=${VIBE_TRADING_API_KEY:-}
      # 海外节点（可选）：为空则海外源回落国内 openbb
      - OPENBB_OVERSEAS_API_URL=${OPENBB_OVERSEAS_API_URL:-}
      - OPENBB_OVERSEAS_TOKEN=${OPENBB_OVERSEAS_TOKEN:-}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - dev-net
    depends_on:
      openbb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # PostgreSQL（init.sql 由 data-collector 持有；不映射宿主机端口，仅内网可见）
  postgres:
    image: postgres:16-alpine
    container_name: tradeck-dev-postgres
    environment:
      POSTGRES_DB: tradeck
      POSTGRES_USER: tradeck
      POSTGRES_PASSWORD: tradeck_dev
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
      - ../apps/data-collector/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # collector（数据管道/写者：定时拉取数据源写库 + 内部运维 API）
  # dev 环境从源码跑 uvicorn --reload；映射 8082 仅供宿主机调试
  collector:
    build: ../apps/data-collector
    container_name: tradeck-dev-collector
    # 显式读项目根 .env（dev compose 默认只找 .devcontainer/.env，根 .env 的
    # FINDB_KEY/TICKFLOW_API_KEY/OPENBB_OVERSEAS_* 才不会丢）
    env_file:
      - ../.env
    environment:
      DATA_MODE: ${DATA_MODE:-live}
      DATABASE_URL: postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      OPENBB_API_URL: http://openbb:6900
      # 海外节点 / TickFlow / findb 密钥由上方 env_file（根 .env）注入，
      # 不在此处插值（environment 空串会覆盖 env_file 的值）。
      DATA_SYNC_TOKEN: ${DATA_SYNC_TOKEN:-tradeck-dev-sync}
      DATA_POOL_ROOT: /data/market-pool
      COLD_STORAGE_BACKEND: local
      COLD_STORAGE_LOCAL_ROOT: /data/market-pool
    volumes:
      - ../apps/data-collector:/app
      # 自有 data pool（findb 仅作一次性初始化源）；重建 collector 后保留。
      - dev-market-pool:/data/market-pool
    ports:
      - "8082:8080"  # 调试端口，避免与 dev 8080 / data-api 8081 冲突
    depends_on:
      postgres:
        condition: service_healthy
      openbb:
        condition: service_healthy
    networks:
      - dev-net
    # dev 模式：热重载
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  # data-api（读 API 服务，dev 环境从源码跑 uvicorn --reload）
  data-api:
    build: ../apps/backend
    container_name: tradeck-dev-data-api
    environment:
      DATA_MODE: ${DATA_MODE:-live}
      DATABASE_URL: postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      OPENBB_API_URL: http://openbb:6900
      DATA_SYNC_TOKEN: ${DATA_SYNC_TOKEN:-tradeck-dev-sync}
      # 消费方鉴权令牌表（JSON：{"<token>": "<consumer_name>"}）。留空 = 内网放行；
      # 配置后量化批量接口（/api/bars）强制有效 X-Service-Token。
      SERVICE_TOKENS: ${SERVICE_TOKENS:-}
      DATA_POOL_ROOT: /data/market-pool
    volumes:
      - ../apps/backend:/app
      - dev-market-pool:/data/market-pool:ro
    ports:
      - "8081:8080"  # 避免和 dev 容器 8080 冲突
    depends_on:
      postgres:
        condition: service_healthy
      openbb:
        condition: service_healthy
      collector:
        condition: service_started
    networks:
      - dev-net
    # dev 模式：热重载
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  # OpenBB Platform
  openbb:
    build:
      context: ..
      dockerfile: docker/openbb/Dockerfile
    container_name: tradeck-dev-openbb
    ports:
      - "6900:6900"
    volumes:
      - dev-openbb-config:/root/.openbb_platform
    environment:
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6900/openapi.json", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dev-net
    # dev 仅启 1 个 worker，避免本地 OpenBB 占用约 1.3 GiB；prod Dockerfile 仍保留 4 workers
    command: ["uvicorn", "openbb_platform_api.main:app", "--host", "0.0.0.0", "--port", "6900", "--workers", "1"]

  # mock 种子（Job 型一次性容器：灌完 mock 数据即退出）
  # 仅在显式启用 mock profile 时运行：--profile mock run --rm mock-seed
  mock-seed:
    build: ../apps/mock
    container_name: tradeck-dev-mock-seed
    profiles: ["mock"]
    environment:
      DATA_MODE: mock
      DATABASE_URL: postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-net

  # quant（量化引擎：回测/选股/因子挖掘，仅经 data-api 读数，绝不直连 DB）
  # Job/服务型容器，默认不启动，按需显式启用 quant profile：
  #   --profile quant run --rm quant ...（一次性任务）或 --profile quant up -d quant（HTTP 服务）
  # dev 环境从源码热挂载运行，改动无需重建镜像
  quant:
    build: ../apps/quant
    container_name: tradeck-dev-quant
    profiles: ["quant"]
    environment:
      # 量化引擎只过 data-api（/api/bars 等批量接口），绝不直连 DB
      BACKEND_API_URL: http://data-api:8080
      # 消费方令牌：与 data-api 的 SERVICE_TOKENS 匹配；dev 留空内网放行
      SERVICE_TOKEN: ${QUANT_SERVICE_TOKEN:-}
      TICKFLOW_API_KEY: ${TICKFLOW_API_KEY:-}
      # Parquet 缓存目录（行情/因子缓存 + enriched 矩阵 + 报告/候选库）
      QUANT_CACHE_DIR: /data/cache
      # AI 策略生成（可选）：全部留空即关闭
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - quant-cache:/data/cache
      # dev 热挂载（与 collector 同模式）
      - ../apps/quant:/app
    ports:
      - "8083:8083"  # HTTP 服务（web 经 Next 代理消费；CLI 用 run --rm 覆盖 CMD）
    depends_on:
      data-api:
        condition: service_started
    networks:
      - dev-net

  # MinIO（S3 兼容对象存储，本地「假 COS」）
  # 用于上线真 COS 前验收 S3 后端（boto3 协议路径/endpoint/网络）。
  # 日常开发用本地文件 provider（COLD_STORAGE_BACKEND=local），不需要本服务；
  # 仅在显式启用 s3-test profile 时起：--profile s3-test up -d minio minio-init
  minio:
    image: minio/minio:latest
    container_name: tradeck-dev-minio
    profiles: ["s3-test"]
    environment:
      # 开发专用默认值（勿用于生产；生产 COS 走 COLD_S3_* 环境变量注入真实密钥）
      MINIO_ROOT_USER: ${COLD_S3_ACCESS_KEY:-tradeck}
      MINIO_ROOT_PASSWORD: ${COLD_S3_SECRET_KEY:-tradeck_dev_cold}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"  # S3 API（调试/宿主机直连用；容器内走 minio:9000）
      - "9001:9001"  # 控制台（可选，调试用）
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # MinIO 初始化：建 cold-lake bucket（Job 型，起一次即退）
  minio-init:
    image: minio/mc:latest
    container_name: tradeck-dev-minio-init
    profiles: ["s3-test"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-tradeck} $${MINIO_ROOT_PASSWORD:-tradeck_dev_cold}
        && mc mb -p local/$${COLD_S3_BUCKET:-tradeck-lake} || true
    environment:
      MINIO_ROOT_USER: ${COLD_S3_ACCESS_KEY:-tradeck}
      MINIO_ROOT_PASSWORD: ${COLD_S3_SECRET_KEY:-tradeck_dev_cold}
      COLD_S3_BUCKET: ${COLD_S3_BUCKET:-tradeck-lake}
    networks:
      - dev-net

volumes:
  dev-node-modules:
  dev-venv:
  dev-openbb-config:
  minio-data:
  quant-cache:
  dev-market-pool:
  dev-postgres-data:
    # DATA_MODE 与数据库 marker 在 backend 启动时强校验；错误卷组合会拒绝启动。
    # live 默认沿用旧卷；mock 命令必须显式指定独立卷。
    name: ${DEV_POSTGRES_VOLUME:-tradeck_devcontainer_dev-postgres-data}

networks:
  dev-net:
    driver: bridge
