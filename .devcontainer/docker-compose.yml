# devcontainer 的 docker-compose — 开发环境
# 与项目根的 docker-compose.yml（prod）独立
# 架构：dev（开发容器）+ postgres + collector + data-api + openbb
#
# DATA_MODE=mock 用法（拆分后 seed 无归属进程，由独立 Job 容器完成）：
#   1) 先灌种子：docker compose -f .devcontainer/docker-compose.yml --profile mock run --rm mock-seed
#   2) 再以 DATA_MODE=mock 起 dev/postgres/data-api（见 AGENTS.md「数据运行模式」一节）
name: tradeck_devcontainer

services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.12
    container_name: tradeck-dev
    ports:
      - "3000:3000"
      - "8080:8080"  # backend dev server
    volumes:
      - ..:/workspace:cached
      - dev-node-modules:/workspace/apps/web/node_modules
      - dev-venv:/workspace/.venv
      - dev-openbb-config:/root/.openbb_platform
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      - DATA_MODE=${DATA_MODE:-live}
      - OPENBB_API_URL=http://openbb:6900
      - BACKEND_API_URL=http://data-api:8080
      # collector 内部运维 API（手动同步触发等，备用）
      - COLLECTOR_API_URL=http://collector:8080
      - DATABASE_URL=postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      # Vibe-Trading AI 研究引擎（独立 devcontainer，宿主机 8899；web 容器经 host.docker.internal 访问）
      - VIBE_TRADING_API_URL=${VIBE_TRADING_API_URL:-http://host.docker.internal:8899}
      - VIBE_TRADING_API_KEY=${VIBE_TRADING_API_KEY:-}
      # 海外节点（可选）：为空则海外源回落国内 openbb
      - OPENBB_OVERSEAS_API_URL=${OPENBB_OVERSEAS_API_URL:-}
      - OPENBB_OVERSEAS_TOKEN=${OPENBB_OVERSEAS_TOKEN:-}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - dev-net
    depends_on:
      openbb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # PostgreSQL（init.sql 由 data-collector 持有；不映射宿主机端口，仅内网可见）
  postgres:
    image: postgres:16-alpine
    container_name: tradeck-dev-postgres
    environment:
      POSTGRES_DB: tradeck
      POSTGRES_USER: tradeck
      POSTGRES_PASSWORD: tradeck_dev
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
      - ../apps/data-collector/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # collector（数据管道/写者：定时拉取数据源写库 + 内部运维 API）
  # dev 环境从源码跑 uvicorn --reload；映射 8082 仅供宿主机调试
  collector:
    build: ../apps/data-collector
    container_name: tradeck-dev-collector
    environment:
      DATA_MODE: ${DATA_MODE:-live}
      DATABASE_URL: postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      OPENBB_API_URL: http://openbb:6900
      # 海外节点（可选）：为空则海外源回落国内 openbb
      OPENBB_OVERSEAS_API_URL: ${OPENBB_OVERSEAS_API_URL:-}
      OPENBB_OVERSEAS_TOKEN: ${OPENBB_OVERSEAS_TOKEN:-}
      DATA_SYNC_TOKEN: ${DATA_SYNC_TOKEN:-tradeck-dev-sync}
      TICKFLOW_API_KEY: ${TICKFLOW_API_KEY:-}
    volumes:
      - ../apps/data-collector:/app
    ports:
      - "8082:8080"  # 调试端口，避免与 dev 8080 / data-api 8081 冲突
    depends_on:
      postgres:
        condition: service_healthy
      openbb:
        condition: service_healthy
    networks:
      - dev-net
    # dev 模式：热重载
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  # data-api（读 API 服务，dev 环境从源码跑 uvicorn --reload）
  data-api:
    build: ../apps/backend
    container_name: tradeck-dev-data-api
    environment:
      DATA_MODE: ${DATA_MODE:-live}
      DATABASE_URL: postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      OPENBB_API_URL: http://openbb:6900
      DATA_SYNC_TOKEN: ${DATA_SYNC_TOKEN:-tradeck-dev-sync}
    volumes:
      - ../apps/backend:/app
    ports:
      - "8081:8080"  # 避免和 dev 容器 8080 冲突
    depends_on:
      postgres:
        condition: service_healthy
      openbb:
        condition: service_healthy
      collector:
        condition: service_started
    networks:
      - dev-net
    # dev 模式：热重载
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  # OpenBB Platform
  openbb:
    build:
      context: ..
      dockerfile: docker/openbb/Dockerfile
    container_name: tradeck-dev-openbb
    ports:
      - "6900:6900"
    volumes:
      - dev-openbb-config:/root/.openbb_platform
    environment:
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6900/openapi.json", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dev-net
    # dev 仅启 1 个 worker，避免本地 OpenBB 占用约 1.3 GiB；prod Dockerfile 仍保留 4 workers
    command: ["uvicorn", "openbb_platform_api.main:app", "--host", "0.0.0.0", "--port", "6900", "--workers", "1"]

  # mock 种子（Job 型一次性容器：灌完 mock 数据即退出）
  # 仅在显式启用 mock profile 时运行：--profile mock run --rm mock-seed
  mock-seed:
    build: ../apps/mock
    container_name: tradeck-dev-mock-seed
    profiles: ["mock"]
    environment:
      DATA_MODE: mock
      DATABASE_URL: postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-net

volumes:
  dev-node-modules:
  dev-venv:
  dev-openbb-config:
  dev-postgres-data:
    # DATA_MODE 与数据库 marker 在 backend 启动时强校验；错误卷组合会拒绝启动。
    # live 默认沿用旧卷；mock 命令必须显式指定独立卷。
    name: ${DEV_POSTGRES_VOLUME:-tradeck_devcontainer_dev-postgres-data}

networks:
  dev-net:
    driver: bridge
