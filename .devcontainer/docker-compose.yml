# devcontainer 的 docker-compose — 开发环境
# 与项目根的 docker-compose.yml（prod）独立
# 架构：dev（开发容器）+ postgres + backend + openbb
services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.12
    container_name: tradeck-dev
    ports:
      - "3000:3000"
      - "8080:8080"  # backend dev server
    volumes:
      - ..:/workspace:cached
      - dev-node-modules:/workspace/apps/web/node_modules
      - dev-venv:/workspace/.venv
      - dev-openbb-config:/root/.openbb_platform
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      - OPENBB_API_URL=http://openbb:6900
      - BACKEND_API_URL=http://backend:8080
      - DATABASE_URL=postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      # 海外节点（可选）：为空则海外源回落国内 openbb
      - OPENBB_OVERSEAS_API_URL=${OPENBB_OVERSEAS_API_URL:-}
      - OPENBB_OVERSEAS_TOKEN=${OPENBB_OVERSEAS_TOKEN:-}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - dev-net
    depends_on:
      openbb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # PostgreSQL（dev 环境共用 prod 的 init.sql）
  postgres:
    image: postgres:16-alpine
    container_name: tradeck-dev-postgres
    environment:
      POSTGRES_DB: tradeck
      POSTGRES_USER: tradeck
      POSTGRES_PASSWORD: tradeck_dev
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
      - ../apps/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # backend（dev 环境，从源码跑 uvicorn --reload）
  backend:
    build: ../apps/backend
    container_name: tradeck-dev-backend
    environment:
      DATABASE_URL: postgresql://tradeck:tradeck_dev@postgres:5432/tradeck
      OPENBB_API_URL: http://openbb:6900
      # 海外节点（可选）：为空则海外源回落国内 openbb
      OPENBB_OVERSEAS_API_URL: ${OPENBB_OVERSEAS_API_URL:-}
      OPENBB_OVERSEAS_TOKEN: ${OPENBB_OVERSEAS_TOKEN:-}
      DATA_SYNC_TOKEN: ${DATA_SYNC_TOKEN:-tradeck-dev-sync}
      # dev 启动自动灌假数据（默认开；可用环境变量 DEV_SEED= 临时关）
      DEV_SEED: "${DEV_SEED-1}"
    volumes:
      - ../apps/backend:/app
    ports:
      - "8081:8080"  # 避免和 dev 容器 8080 冲突
    depends_on:
      postgres:
        condition: service_healthy
      openbb:
        condition: service_healthy
    networks:
      - dev-net
    # dev 模式：热重载
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  # OpenBB Platform
  openbb:
    build:
      context: ..
      dockerfile: docker/openbb/Dockerfile
    container_name: tradeck-dev-openbb
    ports:
      - "6900:6900"
    volumes:
      - dev-openbb-config:/root/.openbb_platform
    environment:
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6900/openapi.json", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dev-net
    # dev 仅启 1 个 worker，避免本地 OpenBB 占用约 1.3 GiB；prod Dockerfile 仍保留 4 workers
    command: ["uvicorn", "openbb_platform_api.main:app", "--host", "0.0.0.0", "--port", "6900", "--workers", "1"]

volumes:
  dev-node-modules:
  dev-venv:
  dev-openbb-config:
  dev-postgres-data:

networks:
  dev-net:
    driver: bridge
