# devcontainer 的 docker-compose — 开发环境
# 与项目根的 docker-compose.yml（prod）独立
# postCreateCommand 和 workspaceFolder 在 devcontainer.json 里
services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.12
    container_name: tradeck-dev
    ports:
      # 前端 dev server（宿主机浏览器访问）
      - "3000:3000"
    volumes:
      # 项目源码 bind mount（实时编辑）
      - ..:/workspace:cached
      # Node 模块隔离（不回写宿主机）
      - dev-node-modules:/workspace/apps/web/node_modules
      # Python venv 隔离
      - dev-venv:/workspace/.venv
      # OpenBB user settings 隔离
      - dev-openbb-config:/root/.openbb_platform
      # Docker socket（devcontainer 里跑 docker compose）
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      - OPENBB_API_URL=http://openbb:6900
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - dev-net
    depends_on:
      openbb:
        condition: service_healthy

  # OpenBB Platform 作为依赖服务（dev 环境用）
  openbb:
    build:
      context: ..
      dockerfile: docker/openbb/Dockerfile
    container_name: tradeck-dev-openbb
    ports:
      - "6900:6900"
    volumes:
      - dev-openbb-config:/root/.openbb_platform
    environment:
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6900/openapi.json", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dev-net

volumes:
  dev-node-modules:
  dev-venv:
  dev-openbb-config:

networks:
  dev-net:
    driver: bridge
