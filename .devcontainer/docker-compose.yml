# Dev Container（serverless 版）：单个 node+pnpm+wrangler 开发容器。
# 无 postgres/redis。源码 bind mount，node_modules 放命名卷（不回写 WSL）。
services:
  dev:
    image: node:24-bookworm-slim
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      # node_modules 及各 package 的放命名卷，避免回写 WSL、避免 IO 慢
      - tradeck_node_modules:/workspace/node_modules
      - tradeck_shared_nm:/workspace/packages/shared/node_modules
      - tradeck_api_nm:/workspace/packages/api/node_modules
      - tradeck_web_nm:/workspace/packages/web/node_modules
      - tradeck_pnpm_store:/root/.local/share/pnpm/store
    ports:
      - '5173:5173' # vite
      - '8787:8787' # wrangler dev
    environment:
      - PNPM_HOME=/root/.local/share/pnpm
      - PATH=/root/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  tradeck_node_modules:
  tradeck_shared_nm:
  tradeck_api_nm:
  tradeck_web_nm:
  tradeck_pnpm_store:
