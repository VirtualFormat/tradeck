# devcontainer 的 docker-compose — 开发环境
# 与项目根的 docker-compose.yml（prod）独立
# 架构：dev（开发容器）+ auth-db（auth 域 PG）+ api + quant（profile）
# 行情数据层（postgres/clickhouse/openbb/collector/data-api）已全部迁往 tradb
# 独立仓库，dev 经宿主机 SSH tunnel（host.docker.internal:8080/8082）访问 prod
# tradb；本文件不再内嵌任何行情数据服务，勿复活。
name: tradeck_devcontainer

services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.12
    container_name: tradeck-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
      # 8080 端口映射已移除：dev 环境数据层改走 prod tradb（SSH tunnel 占宿主机 8080），
      # dev 容器内不再需要 backend dev server 端口（BACKEND_API_URL 指向 prod tradb）
    volumes:
      - ..:/workspace:cached
      - dev-node-modules:/workspace/apps/web/node_modules
      - dev-venv:/workspace/.venv
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      - DATA_MODE=${DATA_MODE:-live}
      # 指向 prod tradb（经宿主机 SSH tunnel host.docker.internal:8080 → VPS tradb data-api）
      - BACKEND_API_URL=${TRADB_API_URL:-http://host.docker.internal:8080}
      # 用户登录：web 的 session 校验 / 登录注册代理走 dev api 服务（同 dev-net 容器名直达）。
      # 不设则会回退 localhost:8080 误打行情 data-api，/api/auth/* 全部 500/404。
      - AUTH_API_URL=http://api:8080
      # 量化引擎 HTTP 服务（/api/quant/* 代理的目标；web 容器经 dev-net 主机名访问）
      - QUANT_API_URL=http://quant:8083
      # Vibe-Trading AI 研究引擎（独立 devcontainer，宿主机 8899；web 容器经 host.docker.internal 访问）
      - VIBE_TRADING_API_URL=${VIBE_TRADING_API_URL:-http://host.docker.internal:8899}
      - VIBE_TRADING_API_KEY=${VIBE_TRADING_API_KEY:-}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - dev-net
    depends_on:
      auth-db:
        condition: service_healthy

  # auth-db（PostgreSQL）：仅承载 auth 域（auth schema 由 apps/backend/init.sql 建出；
  # init.sql 仅空卷首次启动执行）。行情库在 tradb，本库不存行情数据。
  # 不映射宿主机端口，仅内网可见。
  auth-db:
    image: postgres:16-alpine
    container_name: tradeck-dev-auth-db
    environment:
      POSTGRES_DB: tradeck_auth
      POSTGRES_USER: tradeck
      POSTGRES_PASSWORD: tradeck_dev
    volumes:
      - dev-auth-db-data:/var/lib/postgresql/data
      - ../apps/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # api（tradeck 应用层 API：用户域注册/登录/session，对齐 prod 架构）
  # backend 源码热挂载、auth-db 实例（auth schema 由 apps/backend/init.sql 建出）。
  api:
    build: ../apps/backend
    container_name: tradeck-dev-api
    environment:
      AUTH_DATABASE_URL: postgresql://tradeck:tradeck_dev@auth-db:5432/tradeck_auth
      AUTH_INVITE_CODE: ${AUTH_INVITE_CODE:-}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-7}
      # 消费方令牌（JSON）：留空 = 内网放行（dev 默认）
      SERVICE_TOKENS: ${SERVICE_TOKENS:-}
    volumes:
      - ../apps/backend:/app
    ports:
      - "8084:8080"  # 调试端口
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - dev-net
    command: ["uvicorn", "app.auth_main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  # quant（量化引擎：回测/选股/因子挖掘，仅经 data-api 读数，绝不直连 DB）
  # Job/服务型容器，默认不启动，按需显式启用 quant profile：
  #   --profile quant run --rm quant ...（一次性任务）或 --profile quant up -d quant（HTTP 服务）
  # dev 环境从源码热挂载运行，改动无需重建镜像
  quant:
    build: ../apps/quant
    container_name: tradeck-dev-quant
    profiles: ["quant"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 显式读项目根 .env（QUANT_SERVICE_TOKEN 等；dev compose 默认只找 .devcontainer/.env）
    env_file:
      - ../.env
    environment:
      # 量化引擎只过 data-api（/api/bars 等批量接口），绝不直连 DB
      # 指向 prod tradb（经宿主机 SSH tunnel host.docker.internal:8080 → VPS tradb data-api）
      BACKEND_API_URL: ${TRADB_API_URL:-http://host.docker.internal:8080}
      # 消费方令牌：与 data-api 的 SERVICE_TOKENS 匹配；dev 留空内网放行
      # 直接读 env_file（根 .env）里的 QUANT_SERVICE_TOKEN；environment 空串会覆盖 env_file，
      # 故不写默认值，env_file 有值即生效、无值则 quant config 的 SERVICE_TOKEN 默认空串。
      SERVICE_TOKEN: ${QUANT_SERVICE_TOKEN}
      # Parquet 缓存目录（行情/因子缓存 + enriched 矩阵 + 报告/候选库）
      QUANT_CACHE_DIR: /data/cache
      # AI 策略生成（可选）：全部留空即关闭
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-}
    volumes:
      - quant-cache:/data/cache
      # dev 热挂载（改动无需重建镜像）
      - ../apps/quant:/app
    ports:
      - "8083:8083"  # HTTP 服务（web 经 Next 代理消费；CLI 用 run --rm 覆盖 CMD）
    networks:
      - dev-net

volumes:
  dev-node-modules:
  dev-venv:
  quant-cache:
  dev-auth-db-data:

networks:
  dev-net:
    driver: bridge
